<style>
:root{--bg:#131209;--surface:rgba(255,240,225,.04);--line:rgba(255,240,225,.12);--text:#F7F1E8;--muted:#B4A898;--accent:#FFB27A;--accent-ink:#1A1208;--from:#F7F1E8;--to:#B4A898;--ease:cubic-bezier(0.22,1,0.36,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Manrope",ui-sans-serif,system-ui,sans-serif;font-size:16px;line-height:24px}
main{max-width:680px;margin:0 auto;padding:96px 16px}
h1{margin:0;font-size:48px;line-height:48px;font-weight:600;text-wrap:balance;background:linear-gradient(90deg,var(--from),var(--to));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:32px 0 8px;font-size:20px;line-height:28px;font-weight:600}
p{margin:16px 0 0;color:var(--muted);text-wrap:pretty}
a{color:var(--accent)}
.btn{display:inline-flex;margin-top:32px;padding:8px 12px;border-radius:8px;background:#F3EAD7;color:var(--accent-ink);border-radius:9999px;font-weight:600;text-decoration:none;transition:transform 500ms var(--ease)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(0.98)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:600px){h1{font-size:30px;line-height:36px}}
@media (prefers-reduced-motion: reduce){.btn:hover{transform:none}}
</style>
